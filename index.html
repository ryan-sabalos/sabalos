<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sábalos Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0a0e;
            --text-main: #f4f1f7;
            --text-muted: #b5adc4;
            --accent-gradient: linear-gradient(135deg, #ff7e33 0%, #e23670 50%, #7f36db 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
        }

        .logo {
            max-width: 260px;
            width: 100%;
            height: auto;
        }

        .description {
            font-size: 1.15rem;
            line-height: 1.7;
            color: var(--text-muted);
            max-width: 620px;
            font-weight: 300;
        }

        .announcement {
            font-size: 1.35rem;
            font-weight: 600;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .sketch-image {
            max-width: 580px;
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Main Logo -->
        <img src="sabalos_logo.jpeg" alt="Sábalos Games Logo" class="logo">

        <!-- Welcome Text -->
        <p class="description">
            Welcome to our new home. We are a new video game company located in the heart of Mexico with a passion to bring you top quality games that showcase many of our passions.
        </p>

        <!-- Coming Soon Header -->
        <h2 class="announcement">Coming Soon: Compadres - a love letter for Mexico</h2>

        <!-- Sketch Image Preview -->
        <img src="compadres_sketch1.jpg" alt="Compadres Sketch Preview" class="sketch-image">
    </div>

</body>
</html>
